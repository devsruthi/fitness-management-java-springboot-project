spring.application.name=fitness-management
server.port=8080

# Optional local credentials. Copy application-local.properties.example
# to application-local.properties (gitignored).
spring.config.import=optional:classpath:application-local.properties

# Existing local MySQL schema — do not create or replace this database.
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_wellness_center_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate must not change the existing schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

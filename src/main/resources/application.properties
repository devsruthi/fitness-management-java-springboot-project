spring.application.name=fitness-management
server.port=8080

# Hibernate must never create, update, or drop tables.
# The existing MySQL schema is the source of truth.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Database connection is intentionally not configured yet (Stage 3).
# When you are ready to test against your existing local MySQL database,
# create application-local.properties (not committed) or uncomment:
#
# spring.datasource.url=jdbc:mysql://localhost:3306/fitness_wellness_center_system
# spring.datasource.username=YOUR_USERNAME
# spring.datasource.password=YOUR_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
